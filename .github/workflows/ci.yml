name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Gitleaks
        run: |
          version=8.30.1
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      trust_me_bro_center: ${{ steps.filter.outputs.trust_me_bro_center }}
      goog_sec: ${{ steps.filter.outputs.goog_sec }}
      github_security_audit: ${{ steps.filter.outputs.github_security_audit }}
      gws_inspector_py: ${{ steps.filter.outputs.gws_inspector_py }}
      bash_syntax: ${{ steps.filter.outputs.bash_syntax }}
      python_scripts: ${{ steps.filter.outputs.python_scripts }}
      wilma: ${{ steps.filter.outputs.wilma }}
      controlbot: ${{ steps.filter.outputs.controlbot }}
      mesh_security_trainer: ${{ steps.filter.outputs.mesh_security_trainer }}
      pi_kevin: ${{ steps.filter.outputs.pi_kevin }}
      go_dirs: ${{ steps.filter.outputs.go_dirs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          RUN_ALL=false
          if printf '%s\n' "$FILES" | grep -qE '^\.github/workflows/ci\.yml$'; then
            RUN_ALL=true
          fi

          has_match() {
            local pattern="$1"
            if [ "$RUN_ALL" = "true" ] || printf '%s\n' "$FILES" | grep -qE "$pattern"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "trust_me_bro_center=$(has_match '^apps/trust-me-bro-center/')" >> "$GITHUB_OUTPUT"
          echo "goog_sec=$(has_match '^apps/goog-sec/')" >> "$GITHUB_OUTPUT"
          echo "github_security_audit=$(has_match '^auditors/github-security-audit/')" >> "$GITHUB_OUTPUT"
          echo "gws_inspector_py=$(has_match '^auditors/gws-inspector-py/')" >> "$GITHUB_OUTPUT"
          echo "bash_syntax=$(has_match '^(auditors/google-cloud-shell-audit/|auditors/okta-inspector-py/|tools/controlbot/scripts/|demos/gcp-assured-workload-demo/|demos/nist-cybersecurity-mlx-pipeline/scripts/)')" >> "$GITHUB_OUTPUT"
          echo "python_scripts=$(has_match '^(auditors/duo-audit/|auditors/okta-inspector-py/|auditors/slack-audit/|auditors/splunk-audit/|skills/nist-cybersecurity-skills/scripts/|skills/security-skills/skills/iac-security-scanner/scripts/|demos/bsidesorl-2025-grcengcloud/|demos/codex-grc-agent-demo/|demos/databricks-grc-demo/|demos/nist-cybersecurity-mlx-pipeline/|demos/pcidss-mcp-training/)')" >> "$GITHUB_OUTPUT"
          echo "wilma=$(has_match '^auditors/wilma/')" >> "$GITHUB_OUTPUT"
          echo "controlbot=$(has_match '^tools/controlbot/')" >> "$GITHUB_OUTPUT"
          echo "mesh_security_trainer=$(has_match '^tools/mesh-security-trainer/')" >> "$GITHUB_OUTPUT"
          echo "pi_kevin=$(has_match '^tools/pi-kevin/')" >> "$GITHUB_OUTPUT"

          GO_DIRS=()
          for dir in auditors/go-go-okta-inspector auditors/gws-inspector-py tools/cmvp-tui tools/fedramp-browser tools/oscal-cli; do
            if [ "$RUN_ALL" = "true" ] || printf '%s\n' "$FILES" | grep -qE "^${dir}/"; then
              GO_DIRS+=("$dir")
            fi
          done
          if [ "${#GO_DIRS[@]}" -eq 0 ]; then
            GO_JSON="[]"
          else
            GO_JSON=$(printf '%s\n' "${GO_DIRS[@]}" | jq -R . | jq -cs .)
          fi
          echo "go_dirs=${GO_JSON}" >> "$GITHUB_OUTPUT"

  trust-me-bro-center:
    name: apps/trust-me-bro-center
    needs: changes
    if: needs.changes.outputs.trust_me_bro_center == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/trust-me-bro-center
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/trust-me-bro-center/package-lock.json
      - run: npm ci
      - run: npm run check

  goog-sec:
    name: apps/goog-sec
    needs: changes
    if: needs.changes.outputs.goog_sec == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/goog-sec
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/goog-sec/package-lock.json
      - run: npm ci
      - run: npm test

  github-security-audit:
    name: auditors/github-security-audit
    needs: changes
    if: needs.changes.outputs.github_security_audit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditors/github-security-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck and GNU parallel
        run: sudo apt-get update && sudo apt-get install -y shellcheck parallel
      - name: Lint shell scripts
        run: shellcheck github_compliance_audit.sh tests/run_tests.sh tests/mock_api/curl
      - name: Run test suite
        run: bash tests/run_tests.sh

  gws-inspector-py:
    name: auditors/gws-inspector-py
    needs: changes
    if: needs.changes.outputs.gws_inspector_py == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditors/gws-inspector-py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auditors/gws-inspector-py/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            auditors/gws-inspector-py/requirements.txt
            auditors/gws-inspector-py/requirements-dev.txt
      - run: npm ci && npm run check
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m unittest -v test_fedramp_check.py

  bash-syntax:
    name: Bash syntax checks
    needs: changes
    if: needs.changes.outputs.bash_syntax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check bash syntax
        run: |
          find \
            auditors/google-cloud-shell-audit \
            auditors/okta-inspector-py \
            tools/controlbot/scripts \
            demos/gcp-assured-workload-demo \
            demos/nist-cybersecurity-mlx-pipeline/scripts \
            -type f -name '*.sh' -exec bash -n {} +

  python-scripts:
    name: Python syntax checks
    needs: changes
    if: needs.changes.outputs.python_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: |
          find \
            auditors/duo-audit \
            auditors/okta-inspector-py \
            auditors/slack-audit \
            auditors/splunk-audit \
            skills/nist-cybersecurity-skills/scripts \
            skills/security-skills/skills/iac-security-scanner/scripts \
            demos/bsidesorl-2025-grcengcloud \
            demos/codex-grc-agent-demo \
            demos/databricks-grc-demo \
            demos/nist-cybersecurity-mlx-pipeline \
            demos/pcidss-mcp-training \
            -type f -name '*.py' -exec python -m py_compile {} +

  wilma:
    name: auditors/wilma
    needs: changes
    if: needs.changes.outputs.wilma == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditors/wilma
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: auditors/wilma/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check src/ tests/
      - run: pytest tests/

  controlbot:
    name: tools/controlbot
    needs: changes
    if: needs.changes.outputs.controlbot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/controlbot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/controlbot/package-lock.json
      - run: npm ci
      - run: npm test && npm run typecheck

  mesh-security-trainer:
    name: tools/mesh-security-trainer
    needs: changes
    if: needs.changes.outputs.mesh_security_trainer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mesh-security-trainer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mesh-security-trainer/package-lock.json
      - run: npm ci
      - run: npm test

  pi-kevin:
    name: tools/pi-kevin
    needs: changes
    if: needs.changes.outputs.pi_kevin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pi-kevin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pi-kevin/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  go:
    name: Go (${{ matrix.dir }})
    needs: changes
    if: needs.changes.outputs.go_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changes.outputs.go_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - run: go build ./...
      - run: go test ./...

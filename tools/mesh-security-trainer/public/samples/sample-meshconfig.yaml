apiVersion: networking.istio.io/v1alpha1
kind: MeshConfig
metadata:
  name: istio-system
spec:
  # Basic configuration
  defaultConfig:
    image: docker.io/istio/proxyv2:1.18.2
    concurrency: 2
    privileged: true  # Security issue - should be false
    holdApplicationUntilProxyStarts: false  # Security issue - should be true
    sds:
      enabled: false  # Security issue - should be true
    proxyMetadata:
      DNS_CAPTURE: "true"
      ISTIO_META_DNS_CAPTURE: "true"
      ISTIO_META_CLUSTER_ID: "Kubernetes"
  
  # mTLS configuration
  meshMTLS:
    enabled: true
    mode: "PERMISSIVE"  # Security issue - should be STRICT
  
  # Certificate Authority configuration
  ca:
    istiod:
      workloadCertTtl: 24h  # Security issue - too long
      rootCertTtl: 365d
  
  # RBAC configuration  
  rbac:
    mode: OFF  # Security issue - should be ON
  
  # Telemetry configuration
  telemetry:
    enabled: false  # Observability issue
    v1:
      enabled: false
    v2:
      prometheus:
        configOverride:
          inboundSidecar:
            disable_host_header_fallback: false  # Security issue
  
  # Outbound traffic policy
  outboundTrafficPolicy:
    mode: ALLOW_ANY  # Security issue - should be REGISTRY_ONLY
  
  # Extension providers
  extensionProviders:
  - name: prometheus
    prometheus:
      service: prometheus.istio-system.svc.cluster.local
      port: 9090
  
  # Default proxy configuration
  defaultProviders:
    metrics:
    - prometheus
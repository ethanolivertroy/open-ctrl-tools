title = "Open Control Tools secret scan configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Lambda env-var test fixture in Wilma"
condition = "AND"
paths = [
  '^auditors/wilma/tests/test_agent_checks\.py$',
]
regexes = [
  '^sk-1234567890abcdefghijklmnop$',
]

[[allowlists]]
description = "Blank Drata example API key followed by the literal public region default"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^DRATA_API_KEY=\r?\nDRATA_REGION=us$''']
paths = ['^tools/drata-cli/\.env\.example$']

# Synthetic credential-redaction fixtures from grclanker (non-vendor-prefixed generic/PEM/JWT shapes).
# Every exception requires BOTH its exact file path and its exact fixture value.


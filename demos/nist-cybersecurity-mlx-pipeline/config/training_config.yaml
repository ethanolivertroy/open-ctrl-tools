# MLX Fine-Tuning Configuration for NIST Cybersecurity Model

model:
  name: "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit"  # Specialized for code + technical docs
  # Qwen2.5-Coder chosen for:
  #   - Superior code generation (HumanEval 85%+)
  #   - Strong CLI knowledge (AWS/GCP/Azure)
  #   - Technical documentation understanding
  #   - MLX optimized 4-bit quantization (~5GB memory)
  #
  # Other tested options:
  #   - mlx-community/Llama-3.2-3B-Instruct-4bit (general purpose, smaller)
  #   - mlx-community/Meta-Llama-3-8B-Instruct-4bit (general purpose, 8B)
  #   - mlx-community/Mistral-7B-Instruct-v0.3-4bit (technical writing)
  #   - mlx-community/Qwen2.5-Coder-14B-Instruct-4bit (larger coder model)

data:
  train_path: "data/training/train.jsonl"
  valid_path: "data/training/valid.jsonl"

training:
  # LoRA Configuration (optimized for 7B Qwen2.5-Coder)
  lora_layers: 16              # Number of layers to apply LoRA (16 for 7B model)
  lora_rank: 16                # LoRA rank (increased to 16 for 7B model capacity)
  lora_alpha: 32               # LoRA alpha (2x rank = 32)
  lora_dropout: 0.05           # Dropout for regularization

  # Training Parameters
  num_iterations: 1000         # Number of training iterations (adjust based on dataset size)
  batch_size: 4                # Batch size (increase if you have memory to spare)
  learning_rate: 1e-5          # Learning rate (1e-5 to 5e-5 typical for fine-tuning)
  warmup_steps: 100            # Warmup iterations

  # Optimization
  grad_checkpoint: true        # Gradient checkpointing to save memory
  max_seq_length: 2048         # Maximum sequence length

  # Validation & Saving
  val_interval: 100            # Validate every N iterations
  save_every: 100              # Save checkpoint every N iterations

output:
  adapter_path: "models/hackidle-nist-coder-lora"
  final_model_path: "models/hackidle-nist-coder-merged"

# System Prompt (embedded in training data)
system_prompt: |
  You are a NIST-focused cybersecurity assistant trained on public NIST
  cybersecurity publications. Use the corpus to help people find likely
  documents, control families, implementation considerations, and draft
  explanations. When a user needs exact control language, exact framework
  step ordering, or exact reference-architecture component names, tell them
  to verify the answer against the source publication.

# Hardware optimizations for Apple Silicon
hardware:
  use_metal: true              # Use Metal GPU acceleration
  memory_efficient: true       # Enable memory optimizations
  # Larger unified-memory Macs can use larger batches or model variants.

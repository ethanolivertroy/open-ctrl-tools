[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-grc-agent-demo"
version = "0.1.0"
description = "GRC assessment demo built with the OpenAI Agents SDK and Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2.0",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grc-agent = "grc_agent.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]


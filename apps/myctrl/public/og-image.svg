<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282a36"/>
      <stop offset="100%" style="stop-color:#1e1f29"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#bd93f9;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#bd93f9;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle purple glow behind icon area -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ambient particle dots (hint at WebGL atmosphere) -->
  <circle cx="80" cy="90" r="3" fill="#bd93f9" opacity="0.08"/>
  <circle cx="950" cy="60" r="4" fill="#8be9fd" opacity="0.06"/>
  <circle cx="1100" cy="180" r="2.5" fill="#bd93f9" opacity="0.07"/>
  <circle cx="200" cy="520" r="3.5" fill="#ff79c6" opacity="0.05"/>
  <circle cx="1050" cy="480" r="3" fill="#50fa7b" opacity="0.06"/>
  <circle cx="700" cy="100" r="2" fill="#bd93f9" opacity="0.08"/>
  <circle cx="500" cy="560" r="4" fill="#8be9fd" opacity="0.04"/>
  <circle cx="850" cy="550" r="2.5" fill="#bd93f9" opacity="0.06"/>

  <!-- Terminal prompt icon -->
  <g transform="translate(100, 200)">
    <path d="M0 0 L80 65 L0 130" stroke="#bd93f9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="100" y="95" width="60" height="20" rx="4" fill="#bd93f9"/>
  </g>

  <!-- Site name -->
  <text x="320" y="280" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="72" font-weight="700" fill="#f8f8f2">myctrl.tools</text>

  <!-- Tagline -->
  <text x="320" y="350" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#6272a4">Security controls reference for 120+ compliance frameworks</text>

  <!-- Framework badges — mixed Dracula colors -->
  <g transform="translate(320, 410)">
    <!-- NIST 800-53 (purple) -->
    <rect x="0" y="0" width="170" height="40" rx="8" fill="#bd93f9" fill-opacity="0.12" stroke="#bd93f9" stroke-opacity="0.3"/>
    <text x="85" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#bd93f9">NIST 800-53</text>

    <!-- PCI-DSS (cyan) -->
    <rect x="186" y="0" width="130" height="40" rx="8" fill="#8be9fd" fill-opacity="0.12" stroke="#8be9fd" stroke-opacity="0.3"/>
    <text x="251" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#8be9fd">PCI-DSS</text>

    <!-- FedRAMP (green) -->
    <rect x="332" y="0" width="148" height="40" rx="8" fill="#50fa7b" fill-opacity="0.12" stroke="#50fa7b" stroke-opacity="0.3"/>
    <text x="406" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#50fa7b">FedRAMP</text>

    <!-- OWASP (pink) -->
    <rect x="496" y="0" width="120" height="40" rx="8" fill="#ff79c6" fill-opacity="0.12" stroke="#ff79c6" stroke-opacity="0.3"/>
    <text x="556" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#ff79c6">OWASP</text>

    <!-- AI RMF (purple) -->
    <rect x="0" y="52" width="130" height="40" rx="8" fill="#bd93f9" fill-opacity="0.12" stroke="#bd93f9" stroke-opacity="0.3"/>
    <text x="65" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#bd93f9">AI RMF</text>

    <!-- ISO 27001 (cyan) -->
    <rect x="146" y="52" width="155" height="40" rx="8" fill="#8be9fd" fill-opacity="0.12" stroke="#8be9fd" stroke-opacity="0.3"/>
    <text x="223" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#8be9fd">ISO 27001</text>

    <!-- EU AI Act (green) -->
    <rect x="317" y="52" width="150" height="40" rx="8" fill="#50fa7b" fill-opacity="0.12" stroke="#50fa7b" stroke-opacity="0.3"/>
    <text x="392" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#50fa7b">EU AI Act</text>

    <!-- +110 more (muted) -->
    <rect x="483" y="52" width="133" height="40" rx="8" fill="#6272a4" fill-opacity="0.12" stroke="#6272a4" stroke-opacity="0.3"/>
    <text x="549" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#6272a4">+110 more</text>
  </g>

  <!-- Subtle grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8f8f2" stroke-width="0.5" stroke-opacity="0.02"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
</svg>

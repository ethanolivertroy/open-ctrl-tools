<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fbfbfb">
  <title>Confirm subscription</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/kumo-public.css">
  <script src="/token-action.js" type="module"></script>
</head>
<body class="public-page" data-theme="kumo" data-mode="light"
      data-endpoint="/api/subscribe/confirm"
      data-progress="Confirming subscription…"
      data-done="You are all set. Meaningful trust center changes will arrive at this address.">
  <main class="token-action-page">
    <div class="token-action-card">
      <h1>Confirm your subscription</h1>
      <p id="token-message">Press the button below to confirm that this address should receive trust center updates. Nothing is sent until you confirm.</p>
      <button class="kumo-btn kumo-btn-primary" id="token-action" type="button">Confirm subscription</button>
      <p class="form-status" id="token-status" role="status"></p>
      <a class="text-link" href="/">Back to the trust center</a>
    </div>
  </main>
</body>
</html>
